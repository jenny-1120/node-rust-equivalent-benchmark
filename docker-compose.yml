name: node-rust-equivalent-benchmark

services:
  node-api:
    build:
      context: ./services/node-api
    container_name: node-rust-equivalent-node-api
    cpus: 2.0
    mem_limit: 2g
    env_file:
      - ./services/node-api/.env
    volumes:
      - ./data:/app/data:ro
    ports:
      - "3001:3001"

  rust-api:
    build:
      context: ./services/rust-api
    container_name: node-rust-equivalent-rust-api
    cpus: 2.0
    mem_limit: 2g
    env_file:
      - ./services/rust-api/.env
    volumes:
      - ./data:/app/data:ro
    ports:
      - "3002:3002"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: node-rust-equivalent-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8080:8080"
    command:
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: node-rust-equivalent-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - node-api
      - rust-api
      - cadvisor

  grafana:
    image: grafana/grafana:11.1.4
    container_name: node-rust-equivalent-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  k6-node:
    image: grafana/k6:0.53.0
    container_name: node-rust-equivalent-k6-node
    user: "0:0"
    volumes:
      - ./bench/k6:/scripts:ro
      - ./results:/results
    command:
      - run
      - /scripts/integrated-search-like.js
      - --env
      - TARGET_URL=http://node-api:3001
      - --summary-export
      - /results/node-summary.json
    depends_on:
      - node-api

  k6-rust:
    image: grafana/k6:0.53.0
    container_name: node-rust-equivalent-k6-rust
    user: "0:0"
    volumes:
      - ./bench/k6:/scripts:ro
      - ./results:/results
    command:
      - run
      - /scripts/integrated-search-like.js
      - --env
      - TARGET_URL=http://rust-api:3002
      - --summary-export
      - /results/rust-summary.json
    depends_on:
      - rust-api
